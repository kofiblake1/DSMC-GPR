[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rarefied"
version = "0.1.0"
description = "DSMC-informed Gaussian Process surrogate for surface fluxes in rarefied external flow"
requires-python = ">=3.10"
dependencies = [
    # In use today
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "tqdm",          # src/rarefied/io/sparta_runs.py:28 -- was undeclared
    "circle-fit",    # optional/guarded: geometry/regions.py:248
    "pyyaml",        # case configs under config/cases/
    # Declared for planned stages [7]-[8] (features -> GP); not yet imported
    "scikit-learn",
]

# NOTE ON THE CLUSTER: this list is resolved by conda locally (environment.yml)
# but NOT by pip on Sherlock. Sherlock is CentOS 7 / glibc 2.17, and current
# numpy/scipy wheels target manylinux_2_28 (glibc >= 2.28), so pip finds no
# compatible wheel, falls back to the source tarball, and the build fails. The
# cluster therefore uses SRCC's on-site-compiled py-* Lmod modules plus a small
# venv for the pure-python remainder. See env.sh.

[tool.setuptools.packages.find]
where = ["src"]
